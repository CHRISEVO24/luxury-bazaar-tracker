name: Luxury Bazaar Daily Inventory Scrape

on:
  schedule:
    - cron: '1 10 * * *'
    - cron: '1 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download latest history.json from releases
        run: |
          ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assets=d.get('assets',[]); match=next((a['url'] for a in assets if a['name']=='history.json'),''); print(match)")
          if [ -n "$ASSET_URL" ]; then
            curl -s -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/octet-stream" "$ASSET_URL" -o history.json \
              && echo "Downloaded history.json ($(du -sh history.json | cut -f1))"
          else
            echo "No existing history.json in releases"
          fi

      - name: Run inventory scraper (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Scraper attempt $attempt of 3..."
            node scrape.js && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, waiting 60s..."
              sleep 60
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          done

      - name: Upload history.json to GitHub Releases
        run: |
          TSTAMP=$(TZ='America/New_York' date '+%Y-%m-%d-%H%M')
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"snapshot-${TSTAMP}\",\"name\":\"Snapshot ${TSTAMP} ET\",\"body\":\"Automated snapshot\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @history.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=history.json"
          echo "Uploaded to release"

      - name: Commit files to repo via API
        run: |
          # Use GitHub API to update files directly - no git conflicts possible
          TIMESTAMP=$(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')

          # Update latest.json via API
          LATEST_SHA=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}"             https://api.github.com/repos/${{ github.repository }}/contents/latest.json             | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          LATEST_B64=$(base64 -w 0 latest.json)
          LATEST_PAYLOAD=$(python3 -c "
import json, sys
payload = {'message': 'Auto update [skip ci] - $TIMESTAMP', 'content': sys.argv[1]}
sha = sys.argv[2]
if sha: payload['sha'] = sha
print(json.dumps(payload))
" "$LATEST_B64" "$LATEST_SHA")

          curl -s -X PUT             -H "Authorization: token ${{ secrets.GH_TOKEN }}"             -H "Content-Type: application/json"             https://api.github.com/repos/${{ github.repository }}/contents/latest.json             -d "$LATEST_PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print('latest.json:', d.get('content',{}).get('name','updated') if 'content' in d else d.get('message','error'))"

          # Update history.json via API
          HISTORY_SHA=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}"             https://api.github.com/repos/${{ github.repository }}/contents/history.json             | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          HISTORY_B64=$(base64 -w 0 history.json)
          HISTORY_PAYLOAD=$(python3 -c "
import json, sys
payload = {'message': 'Auto update [skip ci] - $TIMESTAMP', 'content': sys.argv[1]}
sha = sys.argv[2]
if sha: payload['sha'] = sha
print(json.dumps(payload))
" "$HISTORY_B64" "$HISTORY_SHA")

          curl -s -X PUT             -H "Authorization: token ${{ secrets.GH_TOKEN }}"             -H "Content-Type: application/json"             https://api.github.com/repos/${{ github.repository }}/contents/history.json             -d "$HISTORY_PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print('history.json:', d.get('content',{}).get('name','updated') if 'content' in d else d.get('message','error'))"
}