name: Luxury Bazaar Daily Inventory Scrape

on:
  schedule:
    - cron: '1 10 * * *'
    - cron: '1 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download latest history.json from releases
        run: |
          ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assets=d.get('assets',[]); match=next((a['url'] for a in assets if a['name']=='history.json'),''); print(match)")
          if [ -n "$ASSET_URL" ]; then
            curl -s -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/octet-stream" "$ASSET_URL" -o history.json \
              && echo "Downloaded history.json ($(du -sh history.json | cut -f1))"
          else
            echo "No existing history.json in releases"
          fi

      - name: Run inventory scraper
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Scraper attempt $attempt of 3..."
            node scrape.js && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, waiting 60s..."
              sleep 60
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          done

      - name: Upload history.json to GitHub Releases
        run: |
          TSTAMP=$(TZ='America/New_York' date '+%Y-%m-%d-%H%M')
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"snapshot-${TSTAMP}\",\"name\":\"Snapshot ${TSTAMP} ET\",\"body\":\"Automated snapshot\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @history.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=history.json"
          echo "Uploaded to release"
